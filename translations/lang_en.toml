# FAQ page translations
faq_title = "JuiceBox FAQ"
faq_meta_description = "All your questions about using JuiceBox temporary file host, answered simply."
faq_lead = "Helpful answers about file retention, privacy, moderation, and APIs."
faq_basics = "Basics"
faq_q1 = "What is JuiceBox?"
faq_a1 = "JuiceBox is a volunteer-run, open-source temporary file host. Upload a file, set how long it should stay online, and share the link. Once the timer ends, the file and its metadata are removed automatically. No sign-ups or accounts needed!"
faq_q2 = "Do I need an account?"
faq_a2 = "Nope! JuiceBox works without accounts. We hash your Cloudflare edge IP using a secret pepper (HMAC-SHA256) to track ownership, limits, and deletion rights. Your IP is never stored in plain text."
faq_q3 = "What's the file size limit?"
faq_a3 = "Each file can be up to {max_size} by default. Uploading folders will create a ZIP that also must fit within that limit."
faq_q4 = "Which file types are blocked?"
faq_a4 = "We block executable and risky files like .exe, .dll, .bat, .cmd, .com, .js, .ps1, .sh, .php, and similar. Other extensions may be blocked if abuse appears."
faq_q5 = "Can I hotlink my files?"
faq_a5 = "Absolutely! Each upload gives you a short link like /f/<id>. Hotlink it anywhere until the file expires; after that, it returns a 404."
faq_expiration = "Expiration"
faq_q6 = "When do files disappear?"
faq_a6 = "You choose a retention period from 1 hour to 14 days. Our background worker automatically deletes files and metadata once the timer runs out."
faq_q7 = "Can I extend a file's life?"
faq_a7 = "Unfortunately, no. Once a file finishes uploading, the retention is fixed. You can re-upload with a longer TTL if you need more time."
faq_q8 = "What happens after expiration?"
faq_a8 = "All file data, chunk session info, and ownership hashes are deleted. The link simply stops working and shows a 404."
faq_privacy = "Privacy & Security"
faq_q9 = "Do you log my real IP?"
faq_a9 = "No. We only store a hashed version of your IP for tracking ownership, rate limits, and moderation. Once associated uploads expire, the hash is removed."
faq_q10 = "Are uploads encrypted?"
faq_a10 = "Files are encrypted in transit via HTTPS. They’re not encrypted at rest to keep moderation simple. Treat JuiceBox like a disposable file hand-off, not a vault. Encrypt sensitive files before uploading if needed."
faq_q11 = "Do you scan for malware?"
faq_a11 = "We block obvious executable/script files and do basic MIME checks. Always scan downloads yourself, like receiving a file from a friend."
faq_q12 = "Can others see my files?"
faq_a12 = "Nope! Only people with the exact link can access your files. Random IDs and rate limits prevent guessing."
faq_abuse = "Abuse & Limits"
faq_q13 = "Any rate limits?"
faq_a13 = "Uploads and downloads are limited per hashed IP. Short bursts are fine, but repeated automation may be slowed or return 429 errors."
faq_q14 = "Content rules?"
faq_a14 = "Follow our Terms: no illegal material, malware, doxxing, intimate images without consent, hate content, or copyrighted stuff you don’t control. When unsure, play it safe."
faq_banned = "Banned Content"
faq_q15 = "What content is banned?"
faq_a15 = "Illegal material, CSAM, non-consensual intimate content, doxxing info, malware/exploits, extremist propaganda, and copyrighted works you don’t own."
faq_q16 = "Why these rules?"
faq_a16 = "These keep JuiceBox safe, online, and legal for everyone."
faq_q17 = "What if I upload banned content?"
faq_a17 = "It will be removed, your hashed ownership may be blocked, and serious cases can be escalated to authorities."
faq_removal = "Removal"
faq_q18 = "Can I delete a file early?"
faq_a18 = "Yes! Click the ❌ button next to the file from the same network, or use DELETE on /d/<id> with your hash. Both require the same hashed edge IP."
faq_q19 = "Can staff remove files?"
faq_a19 = "Yes. Admins can remove files violating policy or law, handle legal notices, and prevent abuse."
faq_api = "API Notes"
faq_q20 = "Is there an API?"
faq_a20 = "Yes! POST to /upload with files and optional ttl (1h, 3d, 14d). Chunked uploads use /upload/chunk. Responses are JSON with file links."
faq_q21 = "What TTL values are valid?"
faq_a21 = "1h, 3h, 12h, 1d, 3d, 7d, 14d. Invalid values default to 3d."
faq_feedback = "Need more help? Open an issue or send feedback on GitHub."
faq_intro_label = "Service overview"
faq_intro_heading = "Quick facts before you upload"
faq_intro_body = "JuiceBox is designed for short-lived sharing. Files expire automatically, IPs are hashed, and limits prevent abuse. See highlights below before reading the details."
faq_intro_point_1 = "Retention: 1 hour to 14 days. Expired files are permanently deleted."
faq_intro_point_2 = "Uploads can be single-shot or chunked. Stalled sessions are cleaned up automatically."
faq_intro_point_3 = "Ownership, rate limits, and bans are tracked with hashed IPs only."
faq_intro_point_4 = "Check the Terms if handling sensitive or regulated data."
view_terms = "Read our Terms of Service"

# Terms page translations
terms_title = "JuiceBox Terms of Service"
terms_meta_description = " Terms for using JuiceBox temporary file host."
terms_effective = "Effective: 2025"
terms_last_updated = "Last updated: 2025-11-05"
terms_section_1_heading = "1. Acceptance"
terms_section_1_body = "By using JuiceBox (uploading, sharing, or viewing), you agree to these Terms and our content rules. If you disagree, please stop using the service."
terms_section_2_heading = "2. Service Description"
terms_section_2_body = '''<p>JuiceBox is an open-source, minimal temporary file host for quick sharing:</p>
<ul>
<li>Retention: 1 hour–14 days. Files are auto-deleted after expiration.</li>
<li>Uploads: single-shot or resumable chunk sessions; metadata is cleaned up afterward.</li>
<li>Ownership & moderation: based on hashed Cloudflare IPs with a secret pepper; raw IPs are never stored.</li>
<li>Platform: rate limits, forbidden extension checks, streaming support, and automatic cleanup workers.</li>
</ul>'''
terms_section_3_heading = "3. Definitions"
terms_section_3_body = '''<ul>
<li><strong>"You"</strong> – anyone using JuiceBox.</li>
<li><strong>"Content"</strong> – files, metadata, links, or chunk session info.</li>
<li><strong>"Retention"</strong> – how long your file stays online before deletion.</li>
<li><strong>"Edge IP hash"</strong> – HMAC-SHA256 hash of your IP + secret pepper, for ownership and limits.</li>
<li><strong>"Chunk session"</strong> – resumable upload info until transfer completes or expires.</li>
</ul>'''
terms_section_4_heading = "4. Prohibited Content"
terms_section_4_body = '''<p>Do not upload:</p>
<ul>
<li>Illegal material, CSAM, sexualized depictions of minors.</li>
<li>Non-consensual intimate images, doxxing, or personal identifiers.</li>
<li>Malware, exploit kits, droppers, password dumps, or obfuscated binaries.</li>
<li>Extremist propaganda or hate content targeting protected groups.</li>
<li>Large copyrighted works you do not own.</li>
<li>Anything that abuses JuiceBox bandwidth or infrastructure.</li>
</ul>'''
terms_section_5_heading = "5. User Responsibilities"
terms_section_5_body = '''<ul>
<li>Only upload files you have rights to share.</li>
<li>Respect retention and deletion; don't try to restore expired files.</li>
<li>Do not bypass limits, quotas, or filters.</li>
<li>Don't upload sensitive regulated data or anything you can't afford to be public.</li>
<li>Follow open-source usage rules and avoid scraping or stress-testing the platform.</li>
</ul>'''
terms_section_6_heading = "6. Privacy & Hashing"
terms_section_6_body = '''<p>We prioritize privacy. No accounts, minimal personal data, only hashed IPs.</p>
<ul>
<li>IP hashes track uploads, limits, and abuse reports.</li>
<li>Hashes are purged after associated files expire.</li>
<li>No analytics, tracking pixels, or ads are used.</li>
</ul>'''
terms_section_7_heading = "7. Data Handling & Retention"
terms_section_7_body = '''<p>We store minimal metadata for each file until expiry:</p>
<ul>
<li>Storage ID, sanitized filename, MIME type, byte size, TTL, and expiry timestamp.</li>
<li>Hashed ownership and optional file hash.</li>
<li>Chunk session data for resumable uploads until completion.</li>
</ul>
<p>Expired files and metadata are removed automatically.</p>'''
terms_section_8_heading = "8. Security Posture"
terms_section_8_body = '''<p>Security measures:</p>
<ul>
<li>HTTPS/TLS for transfers.</li>
<li>Ownership hashes control file actions.</li>
<li>Extension filtering and optional checksum verification.</li>
<li>Background cleanup of expired files and sessions.</li>
</ul>
<p>Files aren't encrypted at rest; scan downloads yourself.</p>'''
terms_section_9_heading = "9. Availability & Changes"
terms_section_9_body = "JuiceBox may have downtime or change limits/features. Using the service means you accept updates."
terms_section_10_heading = "10. Early Removal & Moderation"
terms_section_10_body = '''<p>You can remove your files early by:</p>
<ul>
<li>Clicking ❌ in the UI on the same network used for upload.</li>
<li>Sending a DELETE request to the documented endpoint with your hash.</li>
</ul>
<p>Admins can remove files for abuse or legal reasons. Deleted items cannot be recovered.</p>'''
terms_section_11_heading = "11. Copyright / DMCA"
terms_section_11_body = '''<p>To report infringement:</p>
<ul>
<li>Identify the copyrighted work.</li>
<li>Include JuiceBox links to infringing files.</li>
<li>Provide your contact info and statement of good faith.</li>
<li>State under penalty of perjury that info is accurate and authorized.</li>
</ul>
<p>Valid notices trigger review; counter-notices handled as required.</p>'''
terms_section_12_heading = "12. Disclaimer"
terms_section_12_body = "The service is provided as-is. Use at your own risk. No warranties."
terms_section_13_heading = "13. Limitation of Liability"
terms_section_13_body = "The operator is not liable for indirect or special damages, lost profits, or data loss, even if advised of risks."
terms_section_14_heading = "14. Indemnification"
terms_section_14_body = "You agree to protect the operator and contributors from claims arising from your content or misuse."
terms_section_15_heading = "15. Suspension & Termination"
terms_section_15_body = "The operator may suspend or terminate access for abuse, legal issues, or security concerns."
terms_section_16_heading = "16. Rate Limiting & Automated Defenses"
terms_section_16_body = '''<p>Automated protections:</p>
<ul>
<li>Rate limits per hashed IP.</li>
<li>Bans for repeated prohibited uploads or scripted attacks.</li>
<li>Monitoring may temporarily throttle heavy transfers.</li>
</ul>
<p>Bypassing these protections counts as abuse.</p>'''
terms_section_17_heading = "17. Miscellaneous"
terms_section_17_body = "If a provision is invalid, the rest still applies. These Terms don’t create employment or partnerships. Legal disputes follow applicable laws."
terms_section_contact_heading = "Contact"
terms_section_contact_body = "Report abuse, legal issues, or security concerns via GitHub issues or published contact info."


